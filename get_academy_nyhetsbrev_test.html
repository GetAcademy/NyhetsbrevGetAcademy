<p style="margin:0 0 12px;line-height:1.5;color:${BRAND.text};font-family:Arial,Helvetica,sans-serif;">Første steg i løpet er grunnleggende programmering og IT-utvikling. Her finnes det to hovedveier inn: <strong>Start IT</strong> og fagskoleutdanningen <strong>Introduksjon til programmering og IT-utvikling</strong>.</p>

<p style="margin:0 0 12px;line-height:1.5;color:${BRAND.text};font-family:Arial,Helvetica,sans-serif;">Høsten 2026 tilbyr vi realkompetansekurs for dem som er minst 23 år, men mangler realkompetanse for å komme inn på fagskoleutdanning innen IT-utvikling. <strong>Kursbevis fra dette kan også brukes som grunnlag for å søke opptak til andre fagskoler enn Fagskolen GET Academy.</strong></p>
<p style="margin:0 0 12px;line-height:1.5;color:${BRAND.text};font-family:Arial,Helvetica,sans-serif;">Første realkompetansekurs starter 10. august, varer 7 uker og koster 21&nbsp;000 kr. Dette går parallelt med Start IT. Etter fullført, kan man:</p>
<ul style="margin:0 0 12px 20px;padding:0;color:${BRAND.text};line-height:1.5;"><li style="margin:6px 0;">søke seg til annen fagskoleutdanning med realkompetanse</li><li style="margin:6px 0;">søke seg til vår fagskoleutdanning Introduksjon til programmering og IT-utvikling – med oppstart i januar 2027</li><li style="margin:6px 0;">fortsette videre i Start IT-løpet modulvis – 21&nbsp;000 kr per modul, der tre moduler totalt utgjør hele Start IT</li></ul>
<p style="margin:0 0 12px;line-height:1.5;color:${BRAND.text};font-family:Arial,Helvetica,sans-serif;">Det andre realkompetansekurset starter i oktober eller november og gir også mulighet til å søke seg videre til fagskoleutdanning fra januar. Mer informasjon kommer senere.</p>

<hr style="border:0;border-top:1px solid ${BRAND.border};margin:16px 0;">

<p style="margin:0 0 12px;line-height:1.5;color:${BRAND.text};font-family:Arial,Helvetica,sans-serif;">Våren 2027 kan kandidatene gå videre og velge fordypning innen <strong>frontend</strong> eller <strong>backend</strong>. Frontend er allerede etablert som fagskoleutdanning med driftsstøtte som gir egenbetaling på 5&nbsp;000 kr, mens Backend kjøres som kurs inntil NOKUT har godkjent det som fagskoleutdanning. Vi forventer å kunne tilby backend som fagskoleutdanning våren 2027.</p>

<p style="margin:0 0 12px;line-height:1.5;color:${BRAND.text};font-family:Arial,Helvetica,sans-serif;">Etter start og fordypning jobber GET Academy for å finne relevant praksisbedrift. Målet er praksisoppstart august 2027, eller så snart som mulig etterpå.</p>

<p style="margin:0 0 12px;line-height:1.5;color:${BRAND.text};font-family:Arial,Helvetica,sans-serif;">Vi kan ikke garantere praksisplass, men vi jobber aktivt med å finne relevante bedrifter når kandidaten er klar.</p>
